# -------------------------------------------------------------------------------------
# 🔧 Reusable GitHub Action: Setup npm Auth
#
# ✅ Description:
# Writes registry credentials to the runner's `~/.npmrc` (or, after
# actions/setup-node ran with a `registry-url`, to the `.npmrc` it points
# NPM_CONFIG_USERCONFIG at) so npm/pnpm/yarn can install private packages:
#   - Binds one or more scopes to a registry
#   - Stores the auth token for that registry's host
#
# 🌐 Registry-agnostic: `registry` takes any npm-compatible registry - GitHub
# Packages, npmjs, Verdaccio, Artifactory, a private proxy. The auth key is
# derived from whatever URL is passed, so nothing here is GitHub-specific.
#
# 🔐 Note for GitHub Packages (`https://npm.pkg.github.com/`):
# `GITHUB_TOKEN` only grants access to packages owned by the *current*
# repository. Installing a private package published from a different repo or
# organisation needs a classic PAT with the `read:packages` scope (SSO-authorised
# for that organisation), stored as a repository or organisation secret.
#
# 🔒 The token is written to `$HOME/.npmrc` (or setup-node's `.npmrc` in
# RUNNER_TEMP) on the runner, never to the checkout, so it cannot be committed.
# Actions masks the value in logs. Keys setup-node already wrote are never
# overridden, so its NODE_AUTH_TOKEN-based publish auth is unchanged.
#
# ⚠️ On self-hosted runners `~/.npmrc` persists between jobs.
# -------------------------------------------------------------------------------------
# 🧪 Example usage in workflow:
#
# ```yaml
# jobs:
#   ci:
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@v4
#
#       - uses: pixpilot/github-actions/setup-npm-auth@v1
#         with:
#           registry: 'https://npm.pkg.github.com/'
#           token: ${{ secrets.GH_PACKAGES_TOKEN }}
#           scopes: '@my-org-private'
#
#       - run: pnpm install
# ```
#
# Any other registry works the same way:
#
# ```yaml
#       - uses: pixpilot/github-actions/setup-npm-auth@v1
#         with:
#           registry: 'https://npm.example.com/'
#           token: ${{ secrets.PRIVATE_REGISTRY_TOKEN }}
#           scopes: '@acme'
# ```
# -------------------------------------------------------------------------------------

name: Setup npm auth
description: Write registry credentials to the npm user config so private packages can be installed

inputs:
  registry:
    description: >-
      Registry the token authenticates against, as a full URL, for example
      `https://npm.pkg.github.com/` or `https://npm.example.com/`. The trailing
      slash is optional.
    required: true

  token:
    description: >-
      Auth token for `registry`. For GitHub Packages this is a classic PAT with
      the read:packages scope, not GITHUB_TOKEN, unless every private package is
      published from this same repository.
    required: true

  scopes:
    description: >-
      Scopes to bind to `registry`, separated by commas or spaces, with or
      without the leading `@` (for example `@acme-private, @acme-internal`).
      Optional: a lockfile that records absolute tarball URLs resolves without
      it, but `pnpm add` and `pnpm update` need the mapping.
    required: false

runs:
  using: composite
  steps:
    - name: Write registry credentials
      shell: bash
      env:
        NPM_AUTH_TOKEN: ${{ inputs.token }}
        NPM_AUTH_REGISTRY: ${{ inputs.registry }}
        NPM_AUTH_SCOPES: ${{ inputs.scopes }}
      run: |
        set -euo pipefail

        if [ -z "${NPM_AUTH_TOKEN}" ]; then
          echo "::error::No registry token was provided, so private packages will fail to install with a 401. Pass a token that can read them - for GitHub Packages, a classic PAT with the read:packages scope, authorised for the owning organisation and stored as a secret."
          exit 1
        fi

        if [ -z "${NPM_AUTH_REGISTRY}" ]; then
          echo "::error::No registry was provided. Pass the full URL of the registry the token authenticates against, for example registry: 'https://npm.pkg.github.com/'."
          exit 1
        fi

        # npm looks credentials up by registry URL without its scheme, and the
        # key must carry a trailing slash for the lookup to match.
        registry="${NPM_AUTH_REGISTRY%/}/"
        auth_key="//${registry#*://}"

        # actions/setup-node, given a registry-url, writes its own .npmrc and
        # points NPM_CONFIG_USERCONFIG at it, after which npm and pnpm no longer
        # read ~/.npmrc. Add to that file then, so these credentials are used.
        npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
        touch "$npmrc"
        chmod 600 "$npmrc"

        # The last value the file gives `key`, empty when it sets none.
        current() {
          awk -v key="$1=" 'index($0, key) == 1 { value = substr($0, length(key) + 1) } END { print value }' "$npmrc"
        }

        # Appending keeps any registry block actions/setup-node already wrote. In
        # ~/.npmrc a later line overrides an earlier one, so a rotated token
        # still applies on self-hosted runners. In the file NPM_CONFIG_USERCONFIG
        # names, a key that is already set is left alone: setup-node's auth line
        # reads ${NODE_AUTH_TOKEN}, which publishing tools such as
        # changesets-autopilot set to their own token.
        lines=()
        add() {
          local key="$1" value="$2" existing
          existing="$(current "$key")"
          if [ -z "${NPM_CONFIG_USERCONFIG:-}" ] || [ -z "$existing" ]; then
            lines+=("${key}=${value}")
            return
          fi
          if [ "$existing" = '${NODE_AUTH_TOKEN}' ]; then
            existing="${NODE_AUTH_TOKEN:-}"
          fi
          if [ "$existing" != "$value" ]; then
            echo "::warning::${key} is already set in ${npmrc}, most likely by actions/setup-node's registry-url, so the value passed here is not applied. To authenticate that registry with this token, set NODE_AUTH_TOKEN on the step instead."
          fi
        }

        for scope in ${NPM_AUTH_SCOPES//,/ }; do
          scope="${scope#@}"
          [ -n "$scope" ] || continue
          add "@${scope}:registry" "$registry"
        done
        add "${auth_key}:_authToken" "$NPM_AUTH_TOKEN"

        if [ "${#lines[@]}" -gt 0 ]; then
          # setup-node leaves its file without a final newline.
          if [ -s "$npmrc" ] && [ -n "$(tail -c 1 "$npmrc")" ]; then
            echo >> "$npmrc"
          fi
          printf '%s\n' "${lines[@]}" >> "$npmrc"
        fi

        echo "Configured credentials for ${registry} in ${npmrc}"
