# -------------------------------------------------------------------------------------
# 🔧 Reusable GitHub Action: Setup pnpm Project
#
# ✅ Description:
# Prepares a pnpm-based repository for CI:
#   - Installs pnpm (pinned version, or the one from `packageManager` / `pnpm-workspace.yaml`)
#   - Installs Node.js with the pnpm store cache enabled
#   - Runs `pnpm install`
#   - Optionally runs `pnpm run build`
#
# 📦 Node.js version resolution:
#   - `node-version` wins when provided
#   - otherwise `node-version-file` is read (defaults to `.node-version`)
#   - paths are resolved against the **consumer** repository checkout
#
# ⚠️ Requires `actions/checkout` to have run first.
# -------------------------------------------------------------------------------------
# 🧪 Example usage in workflow:
#
# ```yaml
# jobs:
#   ci:
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@v4
#
#       - uses: pixpilot/github-actions/setup-pnpm-project@v1
#         with:
#           registry-url: 'https://registry.npmjs.org'
#           build: 'false'
#
#       - run: pnpm lint
# ```
# -------------------------------------------------------------------------------------

name: Setup pnpm project
description: 'Setup Node.js, install pnpm, install dependencies, and build the project'

inputs:
  node-version-file:
    description: Node.js version file to use
    required: false
    default: .node-version

  node-version:
    description: Node.js version to use
    required: false

  pnpm-version:
    description: pnpm version to use
    required: false

  registry-url:
    description: npm registry URL
    required: false

  scope:
    description: >-
      npm scope to bind to registry-url. Required when publishing to GitHub
      Packages under a scope other than the repository owner, since setup-node
      otherwise defaults to the owner and would redirect unrelated scoped
      packages away from npmjs.
    required: false

  build:
    description: Whether to build the project
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      if: ${{ inputs.pnpm-version != '' }}
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Install pnpm (without version)
      uses: pnpm/action-setup@v4
      if: ${{ inputs.pnpm-version == '' }}

    - name: Setup Node.js with explicit version
      if: ${{ inputs.node-version != '' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Setup Node.js from version file
      if: ${{ inputs.node-version == '' }}
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Install dependencies
      run: pnpm install
      shell: bash

    - name: Build project
      if: ${{ inputs.build == 'true' }}
      run: pnpm run build
      shell: bash
