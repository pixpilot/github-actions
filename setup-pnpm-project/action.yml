# -------------------------------------------------------------------------------------
# 🔧 Reusable GitHub Action: Setup pnpm Project
#
# ✅ Description:
# Prepares a pnpm-based repository for CI:
#   - Optionally starts a Turborepo remote cache backed by the GitHub Actions cache
#   - Installs pnpm (pinned version, or the one from `packageManager` / `pnpm-workspace.yaml`)
#   - Installs Node.js with the pnpm store cache enabled
#   - Runs `pnpm install`
#   - Optionally runs `pnpm run build`
#
# 📦 Node.js version resolution:
#   - `node-version` wins when provided
#   - otherwise `node-version-file` is read (defaults to `.node-version`)
#   - paths are resolved against the **consumer** repository checkout
#
# ⚠️ Requires `actions/checkout` to have run first.
# -------------------------------------------------------------------------------------
# 🧪 Example usage in workflow:
#
# ```yaml
# jobs:
#   ci:
#     runs-on: ubuntu-latest
#     steps:
#       - uses: actions/checkout@v4
#
#       - uses: pixpilot/github-actions/setup-pnpm-project@v1
#         with:
#           registry-url: 'https://registry.npmjs.org'
#           build: 'false'
#           # only for Turborepo repos whose turbo.json allows remote caching
#           turbo-cache: 'true'
#           # only when the repo depends on private packages
#           npm-auth-registry: 'https://npm.pkg.github.com/'
#           npm-auth-token: ${{ secrets.GH_PACKAGES_TOKEN }}
#           npm-auth-scopes: '@my-org-private'
#
#       - run: pnpm lint
# ```
# -------------------------------------------------------------------------------------

name: Setup pnpm project
description: 'Setup Node.js, install pnpm, install dependencies, and build the project'

inputs:
  node-version-file:
    description: Node.js version file to use
    required: false
    default: .node-version

  node-version:
    description: Node.js version to use
    required: false

  pnpm-version:
    description: pnpm version to use
    required: false

  registry-url:
    description: npm registry URL
    required: false

  scope:
    description: >-
      npm scope to bind to registry-url. Required when publishing to GitHub
      Packages under a scope other than the repository owner, since setup-node
      otherwise defaults to the owner and would redirect unrelated scoped
      packages away from npmjs.
    required: false

  npm-auth-token:
    description: >-
      Token for installing private packages. When set, credentials are written
      to ~/.npmrc before `pnpm install` via the setup-npm-auth action, and
      `npm-auth-registry` must be set too. Leave empty when every dependency is
      public.
    required: false

  npm-auth-registry:
    description: >-
      Full URL of the registry `npm-auth-token` authenticates against, for
      example `https://npm.pkg.github.com/` or `https://npm.example.com/`.
      Required whenever `npm-auth-token` is set.
    required: false

  npm-auth-scopes:
    description: >-
      Scopes to bind to `npm-auth-registry`, separated by commas or spaces.
      Unrelated to `scope`, which only configures setup-node for publishing.
    required: false

  build:
    description: Whether to build the project
    required: false
    default: 'false'

  turbo-cache:
    description: >-
      Serve Turborepo's remote cache from the GitHub Actions cache via
      pixpilot/turbo-persistent-cache, so `turbo` commands later in the job
      reuse task outputs from earlier runs. turbo.json must not set
      `remoteCache.enabled` to false. It overrides any existing `TURBO_API` and
      `TURBO_TOKEN`, so leave it off when using Vercel Remote Cache.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # First, so turbo commands run by install scripts or the build step below
    # are cached too.
    - name: Start Turborepo cache server
      if: ${{ inputs.turbo-cache == 'true' }}
      uses: pixpilot/turbo-persistent-cache@v1

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      if: ${{ inputs.pnpm-version != '' }}
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Install pnpm (without version)
      uses: pnpm/action-setup@v4
      if: ${{ inputs.pnpm-version == '' }}

    - name: Setup Node.js with explicit version
      if: ${{ inputs.node-version != '' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: Setup Node.js from version file
      if: ${{ inputs.node-version == '' }}
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    # Runs after setup-node so it appends to, rather than is overwritten by,
    # any registry block setup-node wrote.
    - name: Authenticate with the package registry
      if: ${{ inputs.npm-auth-token != '' }}
      uses: pixpilot/github-actions/setup-npm-auth@v1
      with:
        token: ${{ inputs.npm-auth-token }}
        registry: ${{ inputs.npm-auth-registry }}
        scopes: ${{ inputs.npm-auth-scopes }}

    - name: Install dependencies
      run: pnpm install
      shell: bash

    - name: Build project
      if: ${{ inputs.build == 'true' }}
      run: pnpm run build
      shell: bash
